<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>아라비오 · 검수</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="arabio.css">
<style>
body{display:block;max-width:760px;margin:auto;padding:24px 20px 60px}.review-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:28px}.review-head a{color:var(--henna)}h1{font-size:25px;margin:0}.review-controls{display:flex;gap:12px;flex-wrap:wrap;margin:24px 0}.review-controls label{display:grid;gap:8px;font-size:13px;flex:1}.review-controls select{padding:12px;background:transparent;border:1px solid #cfbda8;color:inherit;font:inherit;min-width:180px}.review-nav{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:24px}.review-nav button{padding:10px 14px;border:1px solid #cfbda8;background:transparent;font:inherit;color:inherit;cursor:pointer}.review-nav button:disabled{opacity:.4;cursor:default}.review-dialogue{border-top:2px solid var(--henna);padding:24px 0 8px}.review-dialogue h2{font-size:18px;margin-bottom:18px}.review-variant{margin-bottom:28px}.review-variant h3{font-size:14px;color:var(--henna);margin-bottom:16px}.review-line{margin:18px 0}.review-line .arabic{font-size:30px;line-height:1.7;margin:8px 0}.review-line p{line-height:1.6}.review-line audio{width:100%;margin-top:10px}.review-note{font-size:13px;line-height:1.8;color:var(--muted)}.review-variant details{margin-top:16px}summary{cursor:pointer}.review-line small{color:var(--muted)}.w{cursor:pointer;border-radius:4px;text-decoration:underline dotted;text-decoration-color:#cfbda8;text-underline-offset:.45em}.w.p{text-decoration-style:solid;text-decoration-color:#b57b66}.w:hover,.w.on{background:#e4e7e1}.wpop{position:absolute;z-index:60;max-width:260px;padding:9px 14px;border-radius:12px;background:#293b34;color:#f4f3f1;font-size:13px;line-height:1.5;text-align:center;display:grid;gap:2px;box-shadow:0 10px 28px #0003;pointer-events:none}.wpop b{font:400 24px/1.3 Amiri,serif}.wpop .mean{font-weight:700}.wpop .parts{display:grid;gap:1px;margin-top:5px;padding-top:6px;border-top:1px solid #ffffff2e;font-size:11.5px;opacity:.85}.wpop .parts bdi{font:15px Amiri,serif;margin-left:4px}.review-tips{margin-top:14px;padding:12px 14px;border-left:2px solid var(--henna);background:#ffffff55}.review-tips h4{font-size:13px;color:var(--henna);margin-bottom:6px}.review-tips li{font-size:14px;line-height:1.7;margin-left:16px}
</style>
</head>
<body>
<header class="review-head"><h1>아라비오 · 검수</h1><a href="./">앱으로 돌아가기</a></header>
<p class="review-note">1~100일차의 대화와 음성을 바로 확인하세요. 여기서 듣거나 이동해도 학습 진도·경험치는 바뀌지 않아요.</p>
<div id="review"><p>불러오는 중…</p></div>
<script>
(async () => {
  const root = document.getElementById('review');
  if (!['localhost','127.0.0.1','[::1]'].includes(location.hostname)) {
    root.textContent = '검수 화면은 이 컴퓨터의 localhost에서만 열 수 있어요.';
    return;
  }
  const esc = s => String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const mix = t => esc(t).replace(/[\u0600-\u06FF]+(?:[ .…]+[\u0600-\u06FF]+)*/g, m => `<bdi dir="rtl" lang="ar">${m}</bdi>`);
  // 단어·숙어 뜻 보기: app.js의 wordify/showGloss와 같은 규칙 (숙어 최대 6단어, 쉼표·마침표를 넘어 묶지 않음)
  let W = {}, P = {}, pop = null;
  const AR = /[\u0621-\u064a\u064b-\u065f\u0670\u0640]+/g, plain = w => w.replace(/[\u064b-\u065f\u0670\u0640]/g, '');
  const wordify = text => {
    const toks = [...text.matchAll(AR)].map(m => ({s:m.index, e:m.index+m[0].length, w:m[0], k:plain(m[0])}));
    let out = '', pos = 0;
    for (let i = 0; i < toks.length;) {
      let len = Math.min(6, toks.length - i);
      for (; len >= 2; len--) { const sp = toks.slice(i, i+len); if (sp.slice(1).every((t,j) => /^\s+$/.test(text.slice(sp[j].e, t.s))) && P[sp.map(t => t.k).join(' ')]) break; }
      const t = toks[i]; out += esc(text.slice(pos, t.s));
      if (len >= 2) { const end = toks[i+len-1].e; out += `<span class="w p" tabindex="0" data-p="${esc(toks.slice(i,i+len).map(x=>x.k).join(' '))}">${esc(text.slice(t.s,end))}</span>`; pos = end; i += len; }
      else { out += W[t.k] ? `<span class="w" tabindex="0" data-w="${t.k}">${esc(t.w)}</span>` : esc(t.w); pos = t.e; i++; }
    }
    return out + esc(text.slice(pos));
  };
  const hideGloss = () => { pop?.remove(); pop = null; document.querySelectorAll('.w.on').forEach(w => w.classList.remove('on')); };
  const showGloss = el => {
    hideGloss(); pop = document.createElement('div'); pop.className = 'wpop';
    const k = el.dataset.p;
    pop.innerHTML = `<b lang="ar" dir="rtl">${esc(el.textContent)}</b><span class="mean">${esc(k ? P[k] : W[el.dataset.w])}</span>` +
      (k ? `<span class="parts">${k.split(' ').filter(x => W[x]).map(x => `<span><bdi lang="ar" dir="rtl">${esc(x)}</bdi> ${esc(W[x])}</span>`).join('')}</span>` : '');
    document.body.appendChild(pop);
    const r = el.getBoundingClientRect(), above = r.top - pop.offsetHeight - 10;
    pop.style.left = `${Math.min(Math.max(8, r.left + r.width/2 - pop.offsetWidth/2), innerWidth - pop.offsetWidth - 8) + scrollX}px`;
    pop.style.top = `${(above > 8 ? above : r.bottom + 10) + scrollY}px`;
    el.classList.add('on');
  };
  document.addEventListener('click', e => { const w = e.target.closest('.w'); if (w) w.classList.contains('on') ? hideGloss() : showGloss(w); else hideGloss(); });
  document.addEventListener('keydown', e => { const w = e.target.closest?.('.w'); if (w && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); showGloss(w); } if (e.key === 'Escape') hideGloss(); });
  const names = {fusha:'푸스하 · 아이만',egypt:'이집트 · 아슈라프',jordan:'요르단 · 야잔'};
  try {
    const data = await fetch('data/sentences.json',{cache:'no-cache'}).then(r=>{if(!r.ok)throw Error();return r.json();});
    W = data.words || {}; P = data.phrases || {};
    root.innerHTML = `<div class="review-controls"><label>일차<select id="review-day" aria-label="검수 일차">${Array.from({length:100},(_,i)=>`<option value="${i+1}">DAY ${i+1} · ${esc(data.sentences.find(s=>s.day===i+1).unitName)}</option>`).join('')}</select></label><label>음성<select id="review-voice" aria-label="검수 음성"><option value="all">세 목소리 모두</option>${Object.entries(names).map(([v,n])=>`<option value="${v}">${n}</option>`).join('')}</select></label></div><div class="review-nav"><button id="review-prev">이전 일차</button><span id="review-position"></span><button id="review-next">다음 일차</button></div><main id="review-dialogues"></main>`;
    const daySelect = document.getElementById('review-day');
    const voiceSelect = document.getElementById('review-voice');
    const requested = Number(new URLSearchParams(location.search).get('day'));
    daySelect.value = requested>=1&&requested<=100 ? String(requested) : '8';
    function render() {
      root.querySelectorAll('audio').forEach(a=>a.pause());
      const day = Number(daySelect.value);
      const variants = voiceSelect.value==='all' ? Object.keys(names) : [voiceSelect.value];
      document.getElementById('review-position').textContent=`${day} / 100`;
      document.getElementById('review-prev').disabled=day===1;
      document.getElementById('review-next').disabled=day===100;
      document.getElementById('review-dialogues').innerHTML=data.sentences.filter(s=>s.day===day).map((s,i)=>`<article class="review-dialogue"><h2>대화 ${i+1} · ${esc(s.unitName)} <small>#${s.id}</small></h2>${variants.map(v=>`<section class="review-variant"><h3>${names[v]}</h3>${['A','B'].map(side=>`<div class="review-line"><small>${side}</small><p class="arabic" dir="rtl" lang="ar">${wordify(s[v][side])}</p><p>${esc(s.ko[side])}</p>${s[v].audio[side]?`<audio controls preload="none" aria-label="${names[v]} 대화 ${i+1} ${side}" src="audio/${encodeURIComponent(s[v].audio[side])}${s[v].audioRevision?.[side] ? `?v=${s[v].audioRevision[side]}` : ''}"></audio>`:'<p class="review-note">음성 준비 중</p>'}</div>`).join('')}${v!=='fusha'?`${(s.tipsByDialect?.[v]||[]).length?`<div class="review-tips"><h4>알아두면 좋은 점</h4><ul>${s.tipsByDialect[v].map(n=>`<li>${mix(n)}</li>`).join('')}</ul></div>`:''}<details><summary>원래 설명 (검수용)</summary><ul>${[...(s.notesByDialect[v]||[]),...(s.memosByDialect[v]||[])].map(n=>`<li>${esc(n)}</li>`).join('')}</ul></details>`:''}</section>`).join('')}</article>`).join('');
      history.replaceState(null,'',`?day=${day}`);
      root.querySelectorAll('audio').forEach(a=>{
        a.addEventListener('play',()=>root.querySelectorAll('audio').forEach(other=>{if(other!==a)other.pause();}));
        a.addEventListener('error',()=>{const note=document.createElement('p');note.className='review-note';note.textContent='음성을 불러오지 못했어요. 새로고침 후 다시 확인해주세요.';a.replaceWith(note);});
      });
    }
    daySelect.addEventListener('change',render);
    voiceSelect.addEventListener('change',render);
    document.getElementById('review-prev').addEventListener('click',()=>{daySelect.value=String(Number(daySelect.value)-1);render();});
    document.getElementById('review-next').addEventListener('click',()=>{daySelect.value=String(Number(daySelect.value)+1);render();});
    render();
  } catch {
    root.textContent='검수 데이터를 불러오지 못했어요. 서버 실행 상태를 확인해주세요.';
  }
})();
</script>
</body>
</html>
